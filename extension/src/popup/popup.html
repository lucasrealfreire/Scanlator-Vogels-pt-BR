<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanlator Vogels PT-BR</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-brand">
          <svg class="brand-hat" width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="32" cy="41.2" rx="28.2" ry="10.4" fill="#F4C430" stroke="#1A1108" stroke-width="2.8" />
            <ellipse cx="29.5" cy="40.2" rx="22.8" ry="6.8" fill="#FFE066" opacity="0.48" />
            <ellipse cx="32" cy="40.6" rx="18.6" ry="5.1" fill="#B0760E" opacity="0.55" />
            <path d="M14.5 38.2 C14.5 21 21.6 13.6 32 13.6 C42.4 13.6 49.5 21 49.5 38.2 C43.4 42.2 20.6 42.2 14.5 38.2 Z" fill="#F4C430" stroke="#1A1108" stroke-width="2.8" stroke-linejoin="round" />
            <ellipse cx="25.5" cy="22.2" rx="8.6" ry="5.6" fill="#FFE066" opacity="0.62" />
            <path d="M15.1 30.2 C22.5 34.0 41.5 34.0 48.9 30.2 L49.5 38.2 C43.4 42.2 20.6 42.2 14.5 38.2 Z" fill="#D62828" stroke="#1A1108" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M18.2 33.4 C24.5 36.0 34.5 36.2 38.8 35.1" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round" opacity="0.72" />
          </svg>
          <div>
            <h1>Scanlator Vogels PT-BR</h1>
            <span class="subtitle">Universal PT-BR • Local + Gemini Free Tier (R$ 0,00)</span>
          </div>
        </div>
        <span id="statusBadge" class="badge stopped">Desligado</span>
      </header>

      <section class="card card-accent">
        <div class="engine-row">
          <button id="engineBtn" type="button" class="btn btn-start">Ligar Motor</button>
          <button id="translateNowBtn" type="button" class="btn btn-page">
            Traduzir Página
          </button>
        </div>
        <div class="engine-row">
          <button id="translateChapterBtn" type="button" class="btn btn-chapter">
            Traduzir Capítulo
          </button>
          <button id="manualCropBtn" type="button" class="btn btn-crop" title="Atalho: Alt+S">
            Recorte (Alt+S)
          </button>
        </div>
        <div id="telemetryGrid" class="telemetry">
          <div><strong>VRAM:</strong> <span id="vramVal">0 MB</span></div>
          <div><strong>Cota hoje:</strong> <span id="quotaVal">0 req(s)</span></div>
          <div><strong>Circuito:</strong> <span id="cbVal">CLOSED</span></div>
          <div><strong>Auto-off:</strong> <span id="idleVal">—</span></div>
        </div>
        <div id="cbBanner" class="banner hidden">
          <span id="cbBannerText">Circuito aberto por cota/instabilidade.</span>
          <button id="resetCbBtn" type="button" class="btn btn-warn btn-sm">
            Testar Retomada
          </button>
        </div>
        <div id="msgBox" class="msg hidden"></div>
      </section>

      <section class="card">
        <label class="switch-row">
          <span>Auto Translate (lotes de 4 págs)</span>
          <input id="autoTranslate" type="checkbox" />
        </label>
        <label class="switch-row">
          <span>Tipografia em CAIXA ALTA (scanlation)</span>
          <input id="uppercase" type="checkbox" checked />
        </label>
      </section>

      <section class="card form-section">
        <div class="two-col">
          <label class="field">
            <span>Idioma de Origem</span>
            <select id="sourceLangSelect"></select>
          </label>
          <label class="field">
            <span>Direção de Leitura</span>
            <select id="readingDirectionSelect"></select>
          </label>
        </div>

        <label class="field">
          <span>Modelo Gemini (Whitelist Free Tier)</span>
          <select id="modelSelect"></select>
        </label>

        <label class="field">
          <span>Estilo de Tradução</span>
          <select id="styleSelect">
            <option value="scanlation">Scanlation PT-BR (Padrão)</option>
            <option value="informal">Informal / Coloquial</option>
            <option value="fiel">Fiel ao Original</option>
            <option value="formal">Formal</option>
          </select>
        </label>

        <label class="field">
          <span>Chave Gemini API (opcional — vazio usa o .env local)</span>
          <input
            id="apiKeyInput"
            type="password"
            placeholder="Usando GEMINI_API_KEY do .env local"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span>Auto-desligamento por inatividade</span>
          <select id="idleTimeoutSelect">
            <option value="120">2 minutos</option>
            <option value="300">5 minutos (Padrão)</option>
            <option value="600">10 minutos</option>
            <option value="900">15 minutos</option>
          </select>
        </label>

        <div class="footer-actions">
          <button id="saveBtn" type="button" class="btn btn-primary">Salvar Ajustes</button>
          <button id="clearCacheBtn" type="button" class="btn btn-ghost">Limpar Cache</button>
        </div>
      </section>

      <details class="card glossary-card" id="glossaryDetails">
        <summary class="glossary-summary">
          <span>Glossário da Obra</span>
          <span id="glossaryCountBadge" class="glossary-badge">0 termos</span>
        </summary>
        <div class="glossary-body">
          <div class="glossary-series-row">
            <select id="glossarySeriesSelect" title="Obra ativa"></select>
            <button id="glossaryRenameBtn" type="button" class="btn btn-ghost btn-sm" title="Renomear obra ativa">
              Renomear
            </button>
          </div>
          <div class="glossary-add-row">
            <input id="glossarySrcInput" type="text" placeholder="Original (ex: Qi)" />
            <input id="glossaryDstInput" type="text" placeholder="PT-BR (ex: Qi)" />
            <button id="glossaryAddBtn" type="button" class="btn btn-primary btn-sm">+</button>
          </div>
          <div id="glossaryList" class="glossary-list"></div>
          <div class="glossary-io-row">
            <button id="glossaryExportBtn" type="button" class="btn btn-ghost btn-sm">
              Exportar JSON
            </button>
            <button id="glossaryImportBtn" type="button" class="btn btn-ghost btn-sm">
              Importar JSON
            </button>
            <input id="glossaryImportFile" type="file" accept=".json,application/json" class="hidden" />
          </div>
        </div>
      </details>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
